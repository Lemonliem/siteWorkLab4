# Workflow автоматической публикации статического сайта на GitHub Pages.
# Файл размещается в репозитории по пути: .github/workflows/deploy.yml

name: Deploy static site   # название workflow (видно на вкладке Actions)

# Триггер: workflow запускается при каждом push в ветку main
on:
  push:
    branches: [ main ]

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read    # чтение файлов репозитория
  pages: write      # разрешение на публикацию в Pages
  id-token: write   # OIDC-токен для подтверждения деплоя

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1. Линтинг HTML и CSS (проверка качества кода)
  # ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v5

      # Шаг 2. Подготовить Node.js для запуска линтеров
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Шаг 3. Проверка HTML через HTMLHint
      # Если в проекте есть .htmlhintrc — конфиг подхватится автоматически
      - name: Lint HTML (HTMLHint)
        run: |
          npx --yes htmlhint "**/*.html" \
            --ignore "node_modules/**,.github/**"

      # Шаг 4. Проверка CSS через Stylelint
      # Используется стандартный набор правил stylelint-config-standard
      - name: Lint CSS (Stylelint)
        run: |
          npx --yes stylelint "**/*.css" \
            --ignore-pattern "node_modules/**" \
            --config '{"extends":"stylelint-config-standard","rules":{"no-empty-source":null}}'

  # ─────────────────────────────────────────────────────────────
  # JOB 2. Деплой на GitHub Pages (запускается только после успешного lint)
  # ─────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: lint            # ⬅️ ключевая строка: деплой ждёт успеха линтера
    environment:
      name: github-pages
      # ссылка на опубликованный сайт появится в сводке запуска
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг 3. Упаковать файлы сайта в артефакт (path: '.' = весь проект)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 4. Опубликовать артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
